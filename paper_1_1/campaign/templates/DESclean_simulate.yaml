# Appendix D: 24 DES-like realisations with centred, spherical haloes (no triaxiality, no miscentering).
# {CHAIN} and {SEED} are filled by make_configs.py (DESclean0..23, seeds 2000..2023).
simulation: true
inference: false
gamma_range: [0.166667, 0.166667]
n_gamma: 1
n_workers: 32
sim_prefix: '{CHAIN}_g'
n_clusters: 15967
z_cluster_range: [0.1, 0.6]
density: 6.7
shape_noise: 0.27
smail_alpha: 2.0
smail_beta: 1.5
smail_z0: 0.4
triaxiality: false
miscentering: false
f_cen: 0.64
sigma_off_mpc_h: 0.32
sim_log_inner_radius: -0.6
sim_log_outer_radius: 0.6
sim_n_radii: 6
n_cov_bootstrap: 200
floor_rmax: 0.5
triaxial_shear_model: exact
seed_offset: {SEED}
measurement_radius_mpc: 5.3
