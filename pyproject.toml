[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "destacking"
version = "0.1.0"
description = "Joint fitting of weak lensing profiles for galaxy cluster scaling relations"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "nautilus-sampler",
    "colossus",
    "corner",
    "h5py",
    "multiprocess",
    "scikit-learn",
    "tqdm",
    "pyyaml",
    "matplotlib",
]

# Two dependencies are not on PyPI, so they cannot be plain PEP 508 entries
# above -- install both separately before using the boost-correction path
# (destacking.simulation, prepare_real_data.py, wazp_stacked_analysis.py,
# gamma_inference.py's boost correction):
#   pip install git+https://github.com/andrevitorelli/xlensing
#   pip install git+https://github.com/tmcclintock/cluster_toolkit
# ("cluster_toolkit" does not exist on PyPI at all under that name -- do
# not add it to `dependencies` above, `pip install -e .` will fail outright
# with "No matching distribution found for cluster_toolkit" if you do;
# verified 2026-09-01.)

[tool.setuptools.packages.find]
include = ["destacking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full end-to-end tests that run the nautilus sampler or a real multiprocess simulation pipeline (run with -m slow)",
]
