# prepare_real_data.py run: WaZP clusters + DES-Y3 metacal/DNF -> a
# gamma_inference.py data_folder.
#
# Variant of wazp_desy3_real_data_floor.yaml with 6 radial bins instead of
# 8, log_inner_radius=-0.6 (was -0.8), log_outer_radius=0.6 unchanged --
# innermost bin center 0.251 Mpc, edges [0.191, 0.331] Mpc. Wider/fewer
# bins over a range that also starts further out gives more galaxies per
# bin, complementing the sigma_e variance floor rather than replacing it --
# both address the same low-galaxy-count problem in the innermost bins
# from different ends (floor: correct the variance when N is small; wider
# bins: make N less small to begin with). See project memory
# bootstrap-covariance-floor-bug / wazp-desy3-root-cause-hypotheses.
#
# cluster_catalog_file / filtered_cache are the SAME cached files as the
# other real-data configs -- cluster selection and source pre-filtering
# don't depend on the radial binning.
#
# Usage: python scripts/auxiliary_scripts/prepare_real_data.py wazp_desy3_real_data_floor6.yaml

# ═══ Cluster catalogue ═══════════════════════════════════════════════════
cluster_catalog_file: $DESTACKING_DATA/real_data/wazp_real_data.fits
clusters_file: /mnt/c/Users/andre/DATA/y6a2_dnf_wazp_v5.0.12.6801_clusters.fits
members_file:  /mnt/c/Users/andre/DATA/y6a2_dnf_wazp_v5.0.12.6801_members.fits

richness_min: 25
z_max:        0.7
require_bcg:  true
mag_gap_r_cut_mpc: 0.5

delta_m_min: 0.0

# ═══ Source catalogue (DES-Y3 metacalibration) ════════════════════════════
metacal_file: /mnt/c/Users/andre/DATA/DESY3_metacal_v03-004.h5
dnf_file:     /mnt/c/Users/andre/DATA/DESY3_GOLD_2_2.1_DNF.h5

filtered_cache: $DESTACKING_DATA/real_data/metacal_filtered.npz
chunk_read: 10000000

# ═══ Measurement ═══════════════════════════════════════════════════════════
radius_mpc: 5.0

background_strategy: margin
background_strategy_kwargs:
  factor: 1.1
  offset: 0.2

log_inner_radius: -0.6
log_outer_radius:  0.6
n_radii:           6

n_cov_bootstrap: 200
min_sources: 20

# Shot-noise variance floor -- see wazp_desy3_real_data_floor.yaml. Same
# sigma_e/floor_rmax; floor_rmax=0.5 still matches the historical r_min_fit
# default even though the bin edges themselves have shifted.
sigma_e:    0.27
floor_rmax: 0.5

n_workers: 12
checkpoint_every: 1000
use_cache: true

# ═══ Output ══════════════════════════════════════════════════════════════
out_dir: $DESTACKING_DATA/real_data/wazp_real_data_floor6_v2
g_idx: 0
gamma_true: 0.0
