# Very high SNR triaxial + miscentered test — the full realistic physics.
# Same conditions as hisnr_triaxial.yaml with miscentering ON, using the
# standard truth parameters (f_cen = 0.64, sigma_off = 0.32 Mpc/h).  The
# fit model assumes the CORRECT miscentering values (fit_fmiss = 1 - f_cen,
# same sigma_off): this tests recovery when the miscentering calibration
# is known perfectly.
#
# Usage: python gamma_inference.py hisnr_tri_mis.yaml

# ═══ Run phases ═══════════════════════════════════════════════════════════
simulation: true
inference:  true

# ═══ Scan (shared) ════════════════════════════════════════════════════════
gamma_range: [-0.5, 1.0]
n_gamma:     11
n_workers:   10       # ~1.5 GB/worker peak in the galaxy bootstrap at this
                      # density; 10 workers stays well inside 30 GB RAM

# ═══ SIMULATION phase ═════════════════════════════════════════════════════
n_clusters:      1000
z_cluster_range: [0.10, 0.60]

density:     1000.0   # gal/arcmin^2 — extreme, for per-cluster SNR
shape_noise: 0.27
smail_alpha: 2.0
smail_beta:  1.5
smail_z0:    0.4

triaxiality:  true
miscentering: true
f_cen:           0.64  # TRUTH: correctly-centred fraction
sigma_off_mpc_h: 0.32  # TRUTH: offset Rayleigh scale [Mpc/h]

sim_log_inner_radius: -0.8
sim_log_outer_radius:  0.6
sim_n_radii:           8

n_cov_bootstrap: 200

sim_prefix: 'sim_hisnr_trimis_g'

# ═══ INFERENCE phase ══════════════════════════════════════════════════════
bootstrap:   true
n_bootstrap: 5
timeout:     1200

# fit radial grid omitted: full runs default to the sim grid
r_min_fit: 0.5

fit_fmiss:           0.36  # model assumes the TRUE miscentering values
fit_sigma_off_mpc_h: 0.32
