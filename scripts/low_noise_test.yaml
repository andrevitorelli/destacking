# Low shape-noise sanity test: 1500 clusters, sigma_e=0.0025
# Purpose: verify full-covariance bootstrap DV is unbiased at high S/N.

density:     7.5
shape_noise: 0.0025

smail_alpha: 2.0
smail_beta:  1.5
smail_z0:    0.4

n_clusters:      1500
z_cluster_range: [0.10, 0.60]

gamma_range: [0.2, 0.2]
n_gamma:     1

bootstrap:       true
n_bootstrap:     50
n_cov_bootstrap: 200

triaxiality:  true
miscentering: true

sim_prefix: 'sim_lownoise6_g'
