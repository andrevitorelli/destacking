# Joint-vs-stacked constraining-power comparison (2026-09-16): the 3-way
# (tercile) Delta-m split, used as the primary stacked-analysis method for
# this comparison -- the standard 2-way (median) split gives only 2 points,
# too few to fit a magnitude-gap slope; 3 points give a minimal line fit
# comparable to the joint fit's gamma_cm. See
# scripts/auxiliary_scripts/stacked_3way_dm_test.py. Reuses the SAME
# simulated data as LSST_gamma+0.167_stacked (the standard 2-way run).
#
# Usage: python scripts/auxiliary_scripts/stacked_3way_dm_test.py scripts/configs/LSST_gamma+0.167_stacked3way.yaml

sim_prefix: "LSST_gamma+0.167_g"
sims_dir:   "~/destacking_data/sims"
