# HPC production config: DES/WaZP-like conditions, true gamma = -0.500.
#
# One of 15 configs spanning true gamma in [-0.5, 1.0] (np.linspace(-0.5,
# 1.0, 15)) at DES/WaZP-like conditions -- see the sibling LSST_gamma*.yaml
# configs for the LSST-like counterpart at the same 15 gamma values. All 15
# DES configs are identical except gamma_range/gamma_true below. Derived
# from the local single-gamma performance test (scripts/perf_test_des_wazp.yaml,
# see that file's history for how density/n_clusters/timeout were chosen)
# with n_bootstrap raised from 10 to the full production value of 100.
# "gamma" here is a synthetic multiplicative shear-recovery test parameter
# injected into the simulation and recovered by the fit -- see docs/MANUAL.md
# for what it means (not an astrophysical slope).
#
# Usage (paired with scripts/configs/DES_gamma-0.500.slurm):
#   python scripts/gamma_inference.py scripts/configs/DES_gamma-0.500.yaml

# ═══ Run phases ═══════════════════════════════════════════════════════════
simulation: true
inference:  true

# ═══ Scan (shared) ════════════════════════════════════════════════════════
gamma_range: [-0.5, -0.5]   # single true-gamma point of the 15-value HPC scan
n_gamma:     1
n_workers:   16           # pool size for BOTH the simulation stage and each
                           # nautilus fit's likelihood pool (16 threads, as requested)

# ═══ SIMULATION phase ═════════════════════════════════════════════════════
# Cluster sample: matches the real WaZP+DES-Y3 checkpoint size (15,967
# clusters, gamma_scan_outputs/wazp_real_data*, per project memory
# sim-data-relocated / bootstrap-covariance-floor-bug) so timing is
# representative of the actual real-data joint fit, not an arbitrary count.
n_clusters:      15967
z_cluster_range: [0.10, 0.60]   # matches the WaZP z-selection

# Source survey — density measured directly from the real catalogue,
# 2026-08-31: ~/destacking_data/real_data/metacal_filtered.npz has
# 126,719,902 sources; HEALPix occupied-pixel footprint area converges to
# ~5200-5290 deg^2 across nside=256/512/1024/2048 -> 6.7-6.8 gal/arcmin^2.
# This supersedes the previously assumed round number of 7.5 gal/arcmin^2
# used elsewhere in the repo (close, but this is the measured value).
density:     6.7          # source density [gal/arcmin^2], measured (see above)
shape_noise: 0.27         # per-component intrinsic ellipticity RMS
smail_alpha: 2.0          # Smail n(z): p(z) ∝ (z/z0)^α exp[−(z/z0)^β]
smail_beta:  1.5          # DES Y3 defaults (destacking.simulation.des_y3_source_pdf):
smail_z0:    0.4          # mean z ~0.65, peak z ~0.4-0.5 -- matches real DES Y3 n(z)

# Physics (realistic per-cluster compute cost)
triaxiality:  true
miscentering: true
f_cen:           0.64
sigma_off_mpc_h: 0.32

# Simulated radial grid [Mpc]: np.logspace(inner, outer, n)
sim_log_inner_radius: -0.8
sim_log_outer_radius:  0.6
sim_n_radii:           8

# Measurement
n_cov_bootstrap: 200      # galaxy bootstrap draws per cluster (DV + cov)

# ═══ INFERENCE phase ══════════════════════════════════════════════════════
bootstrap:   true
n_bootstrap: 100          # 100 likelihood bootstraps, as requested
# Wall-time budget per nautilus fit. Code's own scaling rule (gamma_inference.py):
# "600s default is adequate for ~1500 clusters; larger samples need
# proportionally more". 600 * (15967/1500) ~= 6390s; matches the existing
# wazp_desy3_inference_boost_floor6.yaml convention of 7200s for this same
# cluster count (adds ~13% margin) -- reused here for consistency. With
# n_bootstrap=100 fits run SEQUENTIALLY (each internally parallel over
# n_workers=16), measured single-fit time at this scale was ~12.0 min (see
# 2026-08-31 performance evaluation) -> ~20h total for 100 fits, comfortably
# inside a 7200s-per-fit budget; SLURM --time should give margin above that
# (see the paired .slurm script).
timeout: 7200

r_min_fit: 0.5
fit_fmiss:           0.36
fit_sigma_off_mpc_h: 0.32
