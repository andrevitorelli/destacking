# HPC production config (cluster_runs.md spec), STAGE 1/3 "simulate":
# LSST-like conditions, true gamma = +0.333.
#
# Simulation-only (inference:false) -- writes the checkpoint +
# notebook-compat sim data (LSST_gamma+0.333_g000_real_data.fits/_bgs.pkl under
# ~/destacking_data/sims/, i.e. /scratch/andrezvitorelli/data/sims/ on
# Hypatia via the ~/destacking_data symlink) that BOTH the joint-fit stage
# (2/3) and the stacked-analysis stage (3/3) read, guaranteeing they
# compare against the identical simulated data (cluster_runs.md
# requirement). One of 10 configs spanning true gamma in [-0.5, 1.0]
# (np.linspace(-0.5, 1.0, 10)).
#
# WIDTH_RAD note (2026-09-05): gamma_inference.py's source-injection
# aperture was widened (0.006 -> 0.0169 rad) after this stage's own
# stacked-analysis comparison revealed low-z simulated clusters ran out of
# simulated sky before the stacking grid's outer bin -- see that constant's
# comment in scripts/gamma_inference.py. This increases per-cluster source
# count (~8-11x measured), hence this stage's own walltime/memory budget in
# its paired .slurm script.
#
# Usage: python scripts/gamma_inference.py scripts/configs/LSST_gamma+0.333_simulate.yaml
# (RUN_DIR set by the paired .slurm script, not here.)

simulation: true
inference:  false

gamma_range: [0.333333, 0.333333]
n_gamma:     1
n_workers:   32

sim_prefix: "LSST_gamma+0.333_g"

n_clusters:      80000
z_cluster_range: [0.10, 0.60]

# density=30 gal/arcmin^2 (close to LSST DESC Y10 SRD gold-sample density
# of 27, Mandelbaum+2018); n(z) = LSST Y10 SRD Smail form, verified to
# give <z>~1.04 matching the literature.
density:     30.0
shape_noise: 0.27
smail_alpha: 2.0
smail_beta:  0.68
smail_z0:    0.11

triaxiality:  true
miscentering: true
f_cen:           0.64
sigma_off_mpc_h: 0.32

sim_log_inner_radius: -0.8
sim_log_outer_radius:  0.6
sim_n_radii:           8

n_cov_bootstrap: 200

