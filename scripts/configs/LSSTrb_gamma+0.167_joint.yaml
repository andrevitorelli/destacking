# Joint-vs-stacked constraining-power comparison (2026-09-09): LSST-like
# conditions, true gamma = +0.167, full scaling relations -- identical
# fit_params to DESrb_gamma+0.167_jointfull.yaml (which mirrors real-data
# wazp_desy3_inference_boost_floor6.yaml exactly), just against the
# LSST-like simulated checkpoint. No `boosts:` key: a simulation has
# perfect knowledge of which galaxies are background sources.
#
# Usage: python scripts/gamma_inference.py scripts/configs/LSSTrb_gamma+0.167_joint.yaml

simulation:  false
inference:   true
data_folder: /scratch/andrezvitorelli/data/output/LSSTrb_gamma+0.167_sim

fit_log_inner_radius: -0.6
fit_log_outer_radius:  0.6
fit_n_radii:           6

gamma_range: [0.167, 0.167]
n_gamma:     1
n_workers:   32

bootstrap:   true
n_bootstrap: 50
timeout:     1728

r_min_fit: 0.0

fit_params:
  c0:           {fit: true, prior: gaussian, loc: 4.5,   scale: 3.0}
  alpha_cm:     {fit: true, prior: gaussian, loc: -0.088, scale: 0.3}
  beta_cm:      {fit: true, prior: gaussian, loc: -0.4,  scale: 1.5}
  gamma_cm:     {fit: true, prior: gaussian, loc: 0.0,   scale: 10.5}
  log_M_norm:   {fit: true, prior: gaussian, loc: 0.0,   scale: 0.3}
  alpha_mr:     {fit: true, prior: gaussian, loc: 1.356, scale: 0.5}
  beta_mr:      {fit: true, prior: gaussian, loc: -0.30, scale: 0.3}
  f_mis:        {fit: true, prior: flat, lo: 0.0, hi: 1.0}
  sigma_off:    {fit: true, prior: flat, lo: 0.0, hi: 1.0}
