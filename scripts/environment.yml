# Conda environment for running destacking and xlensing (locally or on an HPC cluster).
#
# Usage (micromamba is the fastest way to solve it; conda/mamba also work):
#   micromamba create -n destacking -f scripts/environment.yml
#   micromamba activate destacking
#   pip install git+https://github.com/tmcclintock/cluster_toolkit
#   pip install git+https://github.com/andrevitorelli/xlensing     # or `pip install -e path/to/xlensing`
#   pip install -e .                                                # this repository
#
# cluster_toolkit needs GSL (the `gsl` dependency below) and a C compiler at
# install time, so it is installed with pip after the environment exists.
name: destacking
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - astropy
  - corner
  - h5py
  - multiprocess
  - scikit-learn
  - tqdm
  - pyyaml
  - matplotlib
  - gsl
  - ngmix      # required by xlensing.sims (metacalibration)
  - pip
  - pip:
      # Not on conda-forge; small pure-Python/wheel packages, safe via pip.
      - nautilus-sampler
      - colossus
