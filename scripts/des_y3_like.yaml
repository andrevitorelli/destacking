# DES Y3-like gamma_scan configuration.
# Matches the WaZP cluster sample and DES Y3 source galaxy density.
#
# Usage:
#   python3 gamma_scan.py des_y3_like.yaml

# ── Source-galaxy survey ──────────────────────────────────────────────────
density: 7.5       # DES Y3 effective source density [gal/arcmin^2]

smail_alpha: 2.0
smail_beta:  1.5
smail_z0:    0.4

# ── Cluster catalogue ─────────────────────────────────────────────────────
n_clusters:      15000
z_cluster_range: [0.10, 0.60]

# ── Gamma scan ────────────────────────────────────────────────────────────
gamma_range: [-0.2, 0.2]
n_gamma:     3

# ── Bootstrap ─────────────────────────────────────────────────────────────
bootstrap:   true
n_bootstrap:     50
n_cov_bootstrap: 200

# ── Physics switches ──────────────────────────────────────────────────────
triaxiality:  true
miscentering: true
