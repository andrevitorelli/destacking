# Annulus-averaged-model refit of the spherical high-SNR run.
# Inference-only on the checkpoints of run_2026-07-16T16-22-28; the model
# is patched (by refit_annulus_model.py) to evaluate dSigma as the
# count-weighted average over each radial annulus instead of at the bin
# centre.
#
# NB: predates the FMISS fix — its recorded results were fit with the
# then-current fit_fmiss = 0.36 mismatch; rerunning it now would use the
# fit_fmiss below.
#
# Usage: python refit_annulus_model.py hisnr_annulus_refit.yaml

# ═══ Run phases ═══════════════════════════════════════════════════════════
simulation: false
inference:  true
data_folder: gamma_scan_outputs/run_2026-07-16T16-22-28

# ═══ Scan (shared) ════════════════════════════════════════════════════════
gamma_range: [-0.5, 1.0]
n_gamma:     11
n_workers:   10

# ═══ INFERENCE phase ══════════════════════════════════════════════════════
bootstrap:   true
n_bootstrap: 5
timeout:     2400          # annulus averaging costs ~8x per model call

fit_log_inner_radius: -0.8
fit_log_outer_radius:  0.6
fit_n_radii:           8
r_min_fit:             0.5

fit_fmiss:           0.0
fit_sigma_off_mpc_h: 0.32
