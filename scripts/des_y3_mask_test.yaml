# DES Y3-like test with per-bin masking (no noise floor).
# Bins where the bootstrap estimator fails (too few galaxies for a finite,
# positive variance) are dropped from that cluster's likelihood.

density:     7.5
shape_noise: 0.27

smail_alpha: 2.0
smail_beta:  1.5
smail_z0:    0.4

n_clusters:      1500
z_cluster_range: [0.10, 0.60]

gamma_range: [0.2, 0.2]
n_gamma:     1

bootstrap:       true
n_bootstrap:     50
n_cov_bootstrap: 200

triaxiality:  true
miscentering: true

# v2: Gaussian shape sampler (true sigma_e = 0.27) + per-bin bootstrap masking
sim_prefix: 'sim_desy3_v2_g'
