# DES Y3-like single-gamma timing/performance test with full covariance.
# Run this after enabling single_cluster covariance to benchmark cost.

density: 7.5
smail_alpha: 2.0
smail_beta:  1.5
smail_z0:    0.4

n_clusters:      15000
z_cluster_range: [0.10, 0.60]

gamma_range: [0.2, 0.2]
n_gamma:     1

bootstrap:       true
n_bootstrap:     50
n_cov_bootstrap: 200

triaxiality:  true
miscentering: true

sim_prefix: 'sim_des_covtest3_g'
