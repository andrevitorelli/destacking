# Real-data inference: WaZP clusters + DES-Y3 metacal, prepared by
# prepare_real_data.py (wazp_desy3_real_data_floor6.yaml) into
# gamma_scan_outputs/wazp_real_data_floor6/simulation_g00_gamma+0.0/.
#
# Sanity-check variant of wazp_desy3_inference_boost_floor6.yaml: same
# checkpoint, boost correction, r_min_fit=0, and priors, but with
# wild_outlier_mask reinstated on top of the sigma_e covariance floor
# (both active at once -- floor fixes the variance for low-N bins, mask
# additionally screens genuinely extreme mean ΔΣ values in those same
# bins). Confirmed 2026-07-26 that wild outliers still exist post-floor
# (~0.2% of finite entries have |ΔΣ|>=10000, min/max in the millions) but
# no longer dominate the fit (worst-10-of-15,925 clusters only 1.8-2.8% of
# total chi^2 at prior means) -- this run checks whether masking them too
# changes anything. Only 5 bootstraps (not 50) since this is a quick check,
# not a production run.
#
# Usage: python gamma_inference.py wazp_desy3_inference_boost_floor6_wildmask.yaml

# ═══ Run phases ═══════════════════════════════════════════════════════════
simulation: false
inference:  true
data_folder: gamma_scan_outputs/wazp_real_data_floor6

boosts: data/wazp_boost_fits.pkl

# ═══ Scan (shared) ════════════════════════════════════════════════════════
gamma_range: [0.0, 0.0]
n_gamma:     1
n_workers:   12

n_clusters: 15967

# ═══ INFERENCE phase ══════════════════════════════════════════════════════
bootstrap:   true
n_bootstrap: 5      # quick check, not a production 50-bootstrap run
timeout:     7200

fit_log_inner_radius: -0.6
fit_log_outer_radius:  0.6
fit_n_radii:           6
r_min_fit:             0.0

# Wild-outlier masking, reinstated on top of the variance floor -- see
# header comment. rmax=0.5 matches every prior use of this knob (still
# below bin 1's center of 0.437 Mpc, so bins 0-1 are the ones it can touch).
#
# wild_outlier_min corrected to -10000.0 (was 0.0) 2026-07-26: a one-sided
# [0, 10000) range truncates only the negative tail of per-cluster shot
# noise, which is large and symmetric around zero in these bins -- keeping
# only positive draws manufactures a fake excess signal and drove
# bootstrap_000 to alpha_cm=-0.48/c0=+24.7, wildly outside every unmasked
# bootstrap seen so far. A genuinely two-sided range only screens magnitude,
# not sign.
wild_outlier_mask: true
wild_outlier_rmax: 0.5
wild_outlier_min:  -10000.0
wild_outlier_max:  10000.0

fit_params:
  c0:           {fit: true, prior: gaussian, loc: 4.5,   scale: 3.0}
  alpha_cm:     {fit: true, prior: gaussian, loc: -0.088, scale: 0.3}
  beta_cm:      {fit: true, prior: gaussian, loc: -0.4,  scale: 1.5}
  gamma_cm:     {fit: true, prior: gaussian, loc: 0.0,   scale: 10.5}
  log_M_norm:   {fit: true, prior: gaussian, loc: 0.0,   scale: 0.3}
  alpha_mr:     {fit: true, prior: gaussian, loc: 1.356, scale: 0.5}
  beta_mr:      {fit: true, prior: gaussian, loc: -0.30, scale: 0.3}
  f_mis:        {fit: true, prior: flat, lo: 0.0, hi: 1.0}
  sigma_off:    {fit: true, prior: flat, lo: 0.0, hi: 1.0}
