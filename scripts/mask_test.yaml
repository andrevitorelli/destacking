# Masking test: realistic shape noise, high density so all bins are populated.
# At 100 gal/arcmin² no bins should fail the bootstrap, so per-bin masking
# should not fire (all bins valid).

density:     100.0
shape_noise: 0.27

smail_alpha: 2.0
smail_beta:  1.5
smail_z0:    0.4

n_clusters:      1500
z_cluster_range: [0.10, 0.60]

gamma_range: [0.2, 0.2]
n_gamma:     1

bootstrap:       true
n_bootstrap:     50
n_cov_bootstrap: 200

triaxiality:  true
miscentering: true

sim_prefix: 'sim_masktest_g'
