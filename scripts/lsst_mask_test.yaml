# LSST-like test, same diagnostic format as des_y3_mask_test:
# 1500 clusters, single gamma, 50 cluster-bootstraps, per-bin masking.
# density 40 gal/arcmin^2 (LSST gold sample), realistic shape noise.

density:     40.0
shape_noise: 0.27

smail_alpha: 2.0
smail_beta:  1.5
smail_z0:    0.4

n_clusters:      1500
z_cluster_range: [0.10, 0.60]

gamma_range: [0.2, 0.2]
n_gamma:     1

bootstrap:       true
n_bootstrap:     50
n_cov_bootstrap: 200

triaxiality:  true
miscentering: true

# v2: Gaussian shape sampler (true sigma_e = 0.27) + per-bin bootstrap masking
sim_prefix: 'sim_lsstv2_g'
