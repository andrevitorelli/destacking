# gamma_scan configuration template.
#
# Usage:
#   python3 gamma_scan.py path/to/this.yaml
#   or
#   CONFIG=path/to/this.yaml python3 gamma_scan.py
#
# Any key omitted falls back to (i) the matching environment variable
# (uppercase form, see the comments), or (ii) the hard-coded default.

# ── Source-galaxy survey ──────────────────────────────────────────────────
density:     7.5     # mean galaxy density of the survey [gal/arcmin^2]
                     # (DENSITY env var)

# Smail n(z) parameters, p(z) ∝ (z/z0)^α · exp[−(z/z0)^β]:
smail_alpha: 2.0     # SMAIL_ALPHA env var
smail_beta:  1.5     # SMAIL_BETA env var
smail_z0:    0.4     # SMAIL_Z0   env var

# ── Cluster catalogue ─────────────────────────────────────────────────────
n_clusters:      15000           # N_CLUSTERS env var
z_cluster_range: [0.10, 0.60]    # truth-catalog redshift range

# ── Gamma scan ────────────────────────────────────────────────────────────
gamma_range: [-1.0, 1.0]   # endpoints of np.linspace
n_gamma:     51            # N_GAMMA env var

# ── Bootstrap (per-cluster sample resampling) ─────────────────────────────
n_bootstrap: 1             # N_BOOTSTRAP env var; ignored when bootstrap=false
bootstrap:   false         # post-hoc bootstrap on/off (BOOTSTRAP env var)

# ── Physics switches ──────────────────────────────────────────────────────
triaxiality:  true   # true = triaxial NFW; false = pure spherical
miscentering: true   # true = realistic miscentering; false = all clusters centred

# ── Optional file-prefix override ─────────────────────────────────────────
# Default prefix is chosen automatically based on triaxiality/miscentering
# so that non-default configs don't clobber the canonical sim_g{idx:03d}_*.
# Set this to use your own naming.
# sim_prefix: 'sim_myrun_g'
