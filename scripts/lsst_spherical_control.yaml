# Control for lsst_mask_test: identical LSST-like config but spherical
# NFW and perfect centering. Companion to des_y3_spherical_control.

density:     40.0
shape_noise: 0.27

smail_alpha: 2.0
smail_beta:  1.5
smail_z0:    0.4

n_clusters:      1500
z_cluster_range: [0.10, 0.60]

gamma_range: [0.2, 0.2]
n_gamma:     1

bootstrap:       true
n_bootstrap:     50
n_cov_bootstrap: 200

triaxiality:  false
miscentering: false

# v2: Gaussian shape sampler (true sigma_e = 0.27) + per-bin bootstrap masking
sim_prefix: 'sim_lsstv2_sph_g'
