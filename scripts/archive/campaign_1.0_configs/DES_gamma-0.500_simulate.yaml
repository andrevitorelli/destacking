# HPC production config (cluster_runs.md spec), STAGE 1/3 "simulate":
# DES-like conditions, true gamma = -0.500.
#
# Simulation-only (inference:false) -- writes the checkpoint +
# notebook-compat sim data (DES_gamma-0.500_g000_real_data.fits/_bgs.pkl under
# ~/destacking_data/sims/, i.e. $DESTACKING_DATA/sims/ on
# the HPC cluster via the ~/destacking_data symlink) that BOTH the joint-fit stage
# (2/3) and the stacked-analysis stage (3/3) read, guaranteeing they
# compare against the identical simulated data (cluster_runs.md
# requirement). One of 10 configs spanning true gamma in [-0.5, 1.0]
# (np.linspace(-0.5, 1.0, 10)).
#
# WIDTH_RAD note (2026-09-05): destacking/simulation.py converts WIDTH_RAD
# (a physical target aperture radius [Mpc], see scripts/gamma_inference.py)
# to each cluster's own angular half-width via THAT cluster's own DA(z) --
# fixing a latent bug where every prior version of this pipeline used one
# fixed reference redshift instead, shortchanging low-z clusters' simulated
# field relative to the stacking analysis's fixed-Mpc radial grid. This
# per-cluster fix costs about the same as the pipeline's original (pre-bug)
# baseline -- not the ~10x higher compute/memory an earlier, since-reverted
# fixed-angular-widening attempt would have cost. See scripts/gamma_inference.py's
# WIDTH_RAD comment for the full history.
#
# Usage: python scripts/gamma_inference.py scripts/configs/DES_gamma-0.500_simulate.yaml
# (RUN_DIR set by the paired .slurm script, not here.)

simulation: true
inference:  false

gamma_range: [-0.5, -0.5]
n_gamma:     1
n_workers:   32

sim_prefix: "DES_gamma-0.500_g"

n_clusters:      15967
z_cluster_range: [0.10, 0.60]

# Source survey — density measured directly from the real catalogue,
# 2026-08-31: ~/destacking_data/real_data/metacal_filtered.npz has
# 126,719,902 sources; HEALPix occupied-pixel footprint area converges to
# ~5200-5290 deg^2 across nside=256/512/1024/2048 -> 6.7-6.8 gal/arcmin^2.
density:     6.7
shape_noise: 0.27
smail_alpha: 2.0
smail_beta:  1.5
smail_z0:    0.4

triaxiality:  true
miscentering: true
f_cen:           0.64
sigma_off_mpc_h: 0.32

sim_log_inner_radius: -0.8
sim_log_outer_radius:  0.6
sim_n_radii:           8

n_cov_bootstrap: 200

