# HPC re-run (2026-09-07), STAGE 2/3 "joint": DES-like conditions, true
# gamma = -0.500, joint (destacking) per-cluster fit, inference-only
# against stage 1's ("simulate") already-written checkpoint -- SLURM
# dependency ensures stage 1 completes first. Real-data radial bin
# structure (see the paired simulate config's comment); r_min_fit=0.0
# matches the real pipeline too (every bin reaches the fit -- the original
# campaign's r_min_fit=0.5 masked out low-radius bins on top of an already
# NaN-heavy grid). n_bootstrap=50, n_workers=32 threads, per cluster_runs.md.
#
# Usage: python scripts/gamma_inference.py scripts/configs/DESrb_gamma-0.500_joint.yaml

simulation:  false
inference:   true
data_folder: $DESTACKING_DATA/output/DESrb_gamma-0.500_sim

# REQUIRED in inference-only mode -- must match the simulate stage's grid.
fit_log_inner_radius: -0.6
fit_log_outer_radius:  0.6
fit_n_radii:           6

gamma_range: [-0.5, -0.5]
n_gamma:     1
n_workers:   32

bootstrap:   true
n_bootstrap: 50
# Per-fit timeout policy unchanged from the original campaign (2026-09-05,
# 24h/n_bootstrap -- see the original DES_gamma*_joint.yaml's comment for
# the full history); unrelated to the bin-structure change, kept as a
# general safety cap regardless of whether this re-run's crash rate drops.
timeout: 1728

r_min_fit: 0.0
fit_fmiss:           0.36
fit_sigma_off_mpc_h: 0.32

