# Joint-vs-stacked constraining-power comparison (2026-09-09): fits the
# FULL scaling relations (mass-richness Eq. + mass-concentration-with-gamma
# Eq., all 9 parameters free) exactly as wazp_desy3_inference_boost_floor6.yaml
# does on real data -- unlike every other joint config in this campaign,
# which fixed miscentering for a pure gamma-recovery test.
#
# Reuses the EXISTING LSST_gamma+0.167_sim checkpoint from the original
# (already-reported) LSST campaign directly -- no re-simulation. An
# earlier version of this comparison re-simulated LSST at DES's real-data-
# matching 6-bin/floor grid "for parity"; that was unnecessary and has been
# reverted: LSST never had the low-density masking problem that grid was
# built to fix (near-zero crash rate even on the original 8-bin/no-floor
# grid), and there is no real LSST-like data to match bins against in the
# first place -- that convention only exists for DES-Y3. Radial grid below
# matches this checkpoint's own (LSST_gamma+0.167_joint.yaml's grid, the
# one actually used to produce it).
#
# No `boosts:` key, unlike the real-data config: a simulation has perfect
# knowledge of which galaxies are background sources.
#
# Usage: python scripts/gamma_inference.py scripts/configs/LSST_gamma+0.167_jointfull.yaml

simulation:  false
inference:   true
data_folder: $DESTACKING_DATA/output/LSST_gamma+0.167_sim

fit_log_inner_radius: -0.8
fit_log_outer_radius:  0.6
fit_n_radii:           8

gamma_range: [0.167, 0.167]
n_gamma:     1
n_workers:   32

bootstrap:   true
n_bootstrap: 50
timeout:     1728

r_min_fit: 0.5   # matches LSST_gamma+0.167_joint.yaml's convention for this grid

fit_params:
  c0:           {fit: true, prior: gaussian, loc: 4.5,   scale: 3.0}
  alpha_cm:     {fit: true, prior: gaussian, loc: -0.088, scale: 0.3}
  beta_cm:      {fit: true, prior: gaussian, loc: -0.4,  scale: 1.5}
  gamma_cm:     {fit: true, prior: gaussian, loc: 0.0,   scale: 10.5}
  log_M_norm:   {fit: true, prior: gaussian, loc: 0.0,   scale: 0.3}
  alpha_mr:     {fit: true, prior: gaussian, loc: 1.356, scale: 0.5}
  beta_mr:      {fit: true, prior: gaussian, loc: -0.30, scale: 0.3}
  f_mis:        {fit: true, prior: flat, lo: 0.0, hi: 1.0}
  sigma_off:    {fit: true, prior: flat, lo: 0.0, hi: 1.0}
