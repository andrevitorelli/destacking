# Single-gamma timing test for the LSST-like configuration.
# Run this to estimate wall time per gamma point; multiply by 51 for full scan.

density: 40.0
smail_alpha: 2.0
smail_beta:  1.5
smail_z0:    0.4

n_clusters:      100000
z_cluster_range: [0.10, 0.60]

gamma_range: [0.2, 0.2]   # single truth gamma
n_gamma:     1

bootstrap:   true
n_bootstrap: 50

triaxiality:  true
miscentering: true

sim_prefix: 'sim_lsst_timing_g'
