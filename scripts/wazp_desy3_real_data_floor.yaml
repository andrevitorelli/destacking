# prepare_real_data.py run: WaZP clusters + DES-Y3 metacal/DNF -> a
# gamma_inference.py data_folder.
#
# Variant of wazp_desy3_real_data.yaml testing the sigma_e shot-noise
# variance floor (see xlensing.data.bootstrap_signal's sigma_e/floor_rmax
# params and project memory wazp-desy3-root-cause-hypotheses): a handful
# of inner-radius bins (R<0.5 Mpc) across the real WaZP sample have
# bootstrap-estimated variance 6-7 orders of magnitude below the physical
# shot-noise floor (sigma_e**2 / sum((1+M)W/Sigma_crit**2)), because with
# only 2-3 galaxies in the bin the weighted-ratio bootstrap estimator can
# happen to barely move across resamples. One such cluster was enough to
# single-handedly dominate the entire 15,967-cluster joint likelihood once
# r_min_fit=0 let that bin reach the fit. This run floors those bins at
# the shot-noise-only lower bound instead of trusting the raw bootstrap
# variance, and writes to a SEPARATE out_dir so the original
# wazp_real_data checkpoint (no floor) is preserved for comparison.
#
# cluster_catalog_file / filtered_cache are intentionally the SAME as the
# baseline config -- cluster selection and source pre-filtering don't
# depend on sigma_e/floor_rmax, so those expensive caches (built from the
# raw WaZP/DES-Y3 FITS/h5 files) are safely reused; only the per-cluster
# measurement (bootstrap_signal call) actually changes.
#
# Usage: python prepare_real_data.py wazp_desy3_real_data_floor.yaml

# ═══ Cluster catalogue ═══════════════════════════════════════════════════
cluster_catalog_file: data/wazp_real_data.fits
clusters_file: /mnt/c/Users/andre/DATA/y6a2_dnf_wazp_v5.0.12.6801_clusters.fits
members_file:  /mnt/c/Users/andre/DATA/y6a2_dnf_wazp_v5.0.12.6801_members.fits

richness_min: 25
z_max:        0.7
require_bcg:  true
mag_gap_r_cut_mpc: 0.5

delta_m_min: 0.0

# ═══ Source catalogue (DES-Y3 metacalibration) ════════════════════════════
metacal_file: /mnt/c/Users/andre/DATA/DESY3_metacal_v03-004.h5
dnf_file:     /mnt/c/Users/andre/DATA/DESY3_GOLD_2_2.1_DNF.h5

filtered_cache: data/metacal_filtered.npz
chunk_read: 10000000

# ═══ Measurement ═══════════════════════════════════════════════════════════
radius_mpc: 5.0

# Background-galaxy selection strategy -- unchanged baseline (factor=1.1),
# this run isolates the variance-floor fix only.
background_strategy: margin
background_strategy_kwargs:
  factor: 1.1
  offset: 0.2

log_inner_radius: -0.8
log_outer_radius:  0.6
n_radii:           8

n_cov_bootstrap: 200
min_sources: 20

# Shot-noise variance floor -- see header comment. sigma_e=0.27 is the
# DES-Y3 metacal per-component ellipticity dispersion used throughout this
# project's analytic estimates; floor_rmax=0.5 matches the historical
# r_min_fit default, i.e. only the bins that r_min_fit=0 newly exposes to
# the fit get floored.
sigma_e:    0.27
floor_rmax: 0.5

n_workers: 12
checkpoint_every: 1000
use_cache: true

# ═══ Output ══════════════════════════════════════════════════════════════
out_dir: gamma_scan_outputs/wazp_real_data_floor
g_idx: 0
gamma_true: 0.0
