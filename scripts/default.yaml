# Very high SNR reference test.
# Small cluster sample at extreme source density, pure spherical NFW,
# perfectly centred: statistical noise is negligible, so any bias that
# appears is estimator- or model-level.
#
# Usage: python gamma_inference.py default.yaml

# ═══ Run phases ═══════════════════════════════════════════════════════════
simulation: true
inference:  true

# ═══ Scan (shared) ════════════════════════════════════════════════════════
gamma_range: [-0.5, 1.0]
n_gamma:     11
n_workers:   10       # ~1.5 GB/worker peak in the galaxy bootstrap at this
                      # density; 10 workers stays well inside 30 GB RAM

# ═══ SIMULATION phase ═════════════════════════════════════════════════════
n_clusters:      1000
z_cluster_range: [0.10, 0.60]

density:     1000.0   # gal/arcmin^2 — extreme, for per-cluster SNR
shape_noise: 0.27
smail_alpha: 2.0
smail_beta:  1.5
smail_z0:    0.4

triaxiality:  false
miscentering: false
f_cen:           0.64  # TRUTH: correctly-centred fraction (unused: centred)
sigma_off_mpc_h: 0.32  # TRUTH: offset Rayleigh scale [Mpc/h]

sim_log_inner_radius: -0.8   # simulated grid: np.logspace(inner, outer, n)
sim_log_outer_radius:  0.6
sim_n_radii:           8

n_cov_bootstrap: 200

sim_prefix: 'sim_hisnr_g'

# ═══ INFERENCE phase ══════════════════════════════════════════════════════
bootstrap:   true
n_bootstrap: 5        # bootstrap scatter is tiny at this SNR
timeout:     1200     # high-SNR posteriors are the sampler-hostile regime;
                      # give nautilus twice the default budget per fit

# fit radial grid omitted: full runs default to the sim grid
r_min_fit: 0.5        # minimum radius [Mpc] for bins entering the fit

fit_fmiss:           0.0   # model assumes perfectly centred (matches truth)
fit_sigma_off_mpc_h: 0.32
